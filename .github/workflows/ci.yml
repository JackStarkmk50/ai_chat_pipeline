name: ci
on:
  push:
  pull_request:
jobs:
  core-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Provide the SPIRV-Headers cmake package (ggml-vulkan requires it)
        shell: bash
        run: |
          if [ ! -f "$VULKAN_SDK/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ] && [ ! -f "$VULKAN_SDK/Lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ]; then
            git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
            cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -DCMAKE_INSTALL_PREFIX="$VULKAN_SDK"
            cmake --build /tmp/spirv-headers/build --target install
          fi
      - name: Linux system libraries (ALSA mic capture, OpenBLAS for ggml)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopenblas-dev
      - name: Test core (no window)
        run: cargo test -p reply_voice

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  tauri-build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Provide the SPIRV-Headers cmake package (ggml-vulkan requires it)
        shell: bash
        run: |
          if [ ! -f "$VULKAN_SDK/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ] && [ ! -f "$VULKAN_SDK/Lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ]; then
            git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
            cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -DCMAKE_INSTALL_PREFIX="$VULKAN_SDK"
            cmake --build /tmp/spirv-headers/build --target install
          fi
      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev rpm
      - run: npm ci
      - run: npm run build
      - name: Build and bundle the app
        run: npx tauri build
      - name: Verify the transcribe runtime libs staged beside the app
        shell: bash
        run: |
          ls -la src-tauri/transcribe-libs/
          test "$(ls -A src-tauri/transcribe-libs/)" || { echo "staging produced no libraries"; exit 1; }
      - name: Download a real speech model for the packaged-runtime smoke
        shell: bash
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/whisper-small-Q8_0.gguf" \
            "https://huggingface.co/handy-computer/whisper-small-gguf/resolve/c0214bd34be9296695486f838e0142f900803159/whisper-small-Q8_0.gguf"
          echo "9b9c8811bbcc82a7766f0fb0925614bdacb0923b2cc630daeac17108b655b860  $RUNNER_TEMP/whisper-small-Q8_0.gguf" | sha256sum -c -
      - name: Verify the Linux bundles carry the runtime, then smoke the packaged engine
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          dpkg-deb -c src-tauri/target/release/bundle/deb/*.deb | grep -E "usr/lib/Reply Voice/(libtranscribe|libggml-vulkan)" 
          chmod +x src-tauri/target/release/bundle/appimage/*.AppImage
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null)
          ls "$RUNNER_TEMP/squashfs-root/usr/lib/" | grep -E "libtranscribe|libggml-vulkan"
          "$RUNNER_TEMP/squashfs-root/usr/bin/ai_chat_pipeline" --replyvoice-stt-smoke "$RUNNER_TEMP/whisper-small-Q8_0.gguf"
      - name: Verify the Windows installers carry the runtime, then smoke the packaged engine
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          SEVENZ="/c/Program Files/7-Zip/7z.exe"; [ -x "$SEVENZ" ] || SEVENZ=7z
          "$SEVENZ" l src-tauri/target/release/bundle/nsis/*-setup.exe | grep -E "transcribe.dll|ggml-vulkan.dll"
          cp src-tauri/transcribe-libs/*.dll src-tauri/target/release/
          ./src-tauri/target/release/ai_chat_pipeline.exe --replyvoice-stt-smoke "$RUNNER_TEMP/whisper-small-Q8_0.gguf"
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: replyvoice-${{ matrix.os }}-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
