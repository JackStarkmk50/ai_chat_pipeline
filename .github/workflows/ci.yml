name: ci
on:
  push:
  pull_request:
jobs:
  core-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Provide the SPIRV-Headers cmake package (ggml-vulkan requires it)
        shell: bash
        run: |
          if [ ! -f "$VULKAN_SDK/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ] && [ ! -f "$VULKAN_SDK/Lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ]; then
            git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
            cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -DCMAKE_INSTALL_PREFIX="$VULKAN_SDK"
            cmake --build /tmp/spirv-headers/build --target install
          fi
      - name: Linux system libraries (ALSA mic capture, OpenBLAS for ggml)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopenblas-dev
      - name: Test core (no window)
        run: cargo test -p reply_voice

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  tauri-build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Provide the SPIRV-Headers cmake package (ggml-vulkan requires it)
        shell: bash
        run: |
          if [ ! -f "$VULKAN_SDK/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ] && [ ! -f "$VULKAN_SDK/Lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" ]; then
            git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
            cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -DCMAKE_INSTALL_PREFIX="$VULKAN_SDK"
            cmake --build /tmp/spirv-headers/build --target install
          fi
      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev
      - run: npm ci
      - run: npm run build
      - name: Build the app
        run: cargo build --release -p ai_chat_pipeline --locked
