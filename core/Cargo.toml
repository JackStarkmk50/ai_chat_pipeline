[package]
name = "reply_voice"
version = "0.3.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
log = "0.4.29"

# Dictation (Handy's pipeline): microphone capture, VAD, and the transcribe-cpp
# engine. transcribe-cpp and transcribe-cpp-sys must stay in lockstep - the
# engine refuses to load when pre-1.0 base versions differ. Handy's catalog
# (schema 2) pins transcribeCpp 0.4.0 for these exact model artifacts.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
handy-recorder = "0.1.0"
earshot = "1.2.2"
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["serde", "dynamic-backends", "vulkan"] }
transcribe-cpp-sys = "=0.4.0"
libc = "0.2.182"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
handy-recorder = "0.1.0"
earshot = "1.2.2"
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["serde", "dynamic-backends", "vulkan"] }
transcribe-cpp-sys = "=0.4.0"
libc = "0.2.182"
