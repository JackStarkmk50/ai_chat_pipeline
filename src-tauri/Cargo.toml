[package]
name = "ai_chat_pipeline"
version = "0.3.0"
edition = "2021"

[lib]
name = "ai_chat_pipeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai_chat_pipeline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reply_voice = { path = "../core" }

# Direct dependency so this crate's build.rs receives
# DEP_TRANSCRIBE_CPP_RUNTIME_DIR / DEP_TRANSCRIBE_CPP_MODULE_DIR for runtime
# library staging (DEP_ vars reach direct dependents only). Features unify
# with the per-target tables in core/Cargo.toml; keep in the =0.4.0 lockstep.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
transcribe-cpp-sys = { version = "=0.4.0", default-features = false }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
transcribe-cpp-sys = { version = "=0.4.0", default-features = false }
