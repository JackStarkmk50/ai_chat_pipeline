[package]
name = "ai_chat_pipeline"
version = "0.3.0"
edition = "2021"

[lib]
name = "ai_chat_pipeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai_chat_pipeline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reply_voice = { path = "../core" }
