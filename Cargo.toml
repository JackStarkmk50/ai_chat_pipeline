[package]
name = "ai_chat_pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[lib]
name = "reply_voice"
path = "src/lib.rs"

[[bin]]
name = "ai_chat_pipeline"
path = "src/main.rs"

[profile.release]
lto = true
strip = true

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
